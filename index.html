
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Online Shopping</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #172554;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    header input {
      padding: 11px;
      width: min(350px, 100%);
      border: none;
      border-radius: 6px;
      font-size: 15px;
    }

    .cart-button {
      background: #facc15;
      color: #172554;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      background: linear-gradient(120deg, #dbeafe, #fce7f3);
      padding: 55px 6%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 44px);
      color: #172554;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      margin-bottom: 22px;
    }

    .hero a {
      display: inline-block;
      background: #172554;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
    }

    main {
      padding: 35px 6%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
      transition: transform 0.2s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 17px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      min-height: 42px;
    }

    .price {
      color: #15803d;
      font-size: 21px;
      font-weight: bold;
      margin: 12px 0;
    }

    .product button,
    .details-button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 7px;
    }

    .add-button {
      background: #172554;
      color: white;
    }

    .details-button {
      background: #e5e7eb;
      color: #172554;
    }

    .cart-section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-top: 35px;
      box-shadow: 0 3px 12px #00000012;
      scroll-margin-top: 20px;
    }

    .cart-section h2 {
      margin-bottom: 18px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ddd;
      padding: 14px 0;
      flex-wrap: wrap;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-controls button,
    .remove-button {
      border: none;
      border-radius: 4px;
      padding: 7px 11px;
      cursor: pointer;
    }

    .remove-button {
      background: #fee2e2;
      color: #991b1b;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    .checkout-button {
      background: #15803d;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      color: #666;
      padding: 12px 0;
    }

    footer {
      margin-top: 40px;
      background: #172554;
      color: white;
      text-align: center;
      padding: 24px;
      line-height: 1.8;
    }

    dialog {
      width: min(90%, 420px);
      margin: auto;
      padding: 25px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 25px #0004;
    }

    dialog::backdrop {
      background: #0008;
    }

    dialog h2,
    dialog p {
      margin-bottom: 15px;
    }

    .close-button {
      background: #172554;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
      }

      header input {
        order: 3;
      }

      .cart-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ShopEase</div>

    <input
      type="search"
      id="search"
      placeholder="Search products..."
      aria-label="Search products"
    >

    <button class="cart-button" onclick="goToCart()">
      🛒 Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>Welcome to ShopEase</h1>
    <p>Discover amazing products at great prices.</p>
    <a href="#products">Shop Now</a>
  </section>

  <main>
    <h2 class="section-title" id="products">Our Products</h2>

    <div class="products" id="product-list"></div>

    <section class="cart-section" id="cart-section">
      <h2>🛒 Your Shopping Cart</h2>
      <div id="cart-items">
        <p class="empty">Your cart is empty. Start shopping!</p>
      </div>

      <p class="total">
        Total: ₹<span id="cart-total">0.00</span>
      </p>

      <button class="checkout-button" onclick="checkout()">
        Proceed to Checkout
      </button>
    </section>
  </main>

  <dialog id="product-dialog">
    <h2 id="detail-name"></h2>
    <p id="detail-description"></p>
    <p class="price" id="detail-price"></p>
    <button class="close-button" onclick="closeDetails()">
      Close
    </button>
  </dialog>

  <footer>
    <h3>ShopEase</h3>
    <p>Your one-stop online shopping destination.</p>
    <p>© 2026 ShopEase. All rights reserved.</p>
  </footer>

  <script>
    const products = [
      {
        id: 1,
        name: "Wireless Headphones",
        price: 1499,
        description: "Comfortable headphones with clear sound.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        name: "Smart Watch",
        price: 2199,
        description: "A stylish watch for everyday use.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        name: "Running Shoes",
        price: 1799,
        description: "Lightweight shoes for daily activities.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        name: "Backpack",
        price: 999,
        description: "A practical backpack for college and travel.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        name: "Sunglasses",
        price: 799,
        description: "Classic sunglasses for a stylish look.",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 6,
        name: "Camera",
        price: 4999,
        description: "Capture your favorite everyday moments.",
        image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let cart = [];

    const productList = document.getElementById("product-list");

    function renderProducts(items) {
      productList.replaceChildren();

      if (items.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No products found.";
        productList.appendChild(message);
        return;
      }

      items.forEach(product => {
        const card = document.createElement("article");
        card.className = "product";

        const image = document.createElement("img");
        image.src = product.image;
        image.alt = product.name;
        image.loading = "lazy";

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("h3");
        name.textContent = product.name;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = product.description;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + product.price.toLocaleString("en-IN");

        const details = document.createElement("button");
        details.className = "details-button";
        details.textContent = "View Details";
        details.onclick = () => showDetails(product.id);

        const add = document.createElement("button");
        add.className = "add-button";
        add.textContent = "Add to Cart";
        add.onclick = () => addToCart(product.id);

        info.append(name, description, price, details, add);
        card.append(image, info);
        productList.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = cart.find(product => product.id === id);

      if (item) {
        item.quantity++;
      } else {
        cart.push({ id, quantity: 1 });
      }

      renderCart();
    }

    function changeQuantity(id, amount) {
      const item = cart.find(product => product.id === id);

      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {
        cart = cart.filter(product => product.id !== id);
      }

      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(product => product.id !== id);
      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById("cart-items");
      cartItems.replaceChildren();

      let total = 0;
      let count = 0;

      if (cart.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "Your cart is empty. Start shopping!";
        cartItems.appendChild(message);
      }

      cart.forEach(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return;

        total += product.price * item.quantity;
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-item";

        const name = document.createElement("strong");
        name.textContent = product.name + " — ₹" +
          (product.price * item.quantity).toLocaleString("en-IN");

        const controls = document.createElement("div");
        controls.className = "quantity-controls";

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Decrease quantity");
        minus.onclick = () => changeQuantity(item.id, -1);

        const quantity = document.createElement("span");
        quantity.textContent = item.quantity;

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Increase quantity");
        plus.onclick = () => changeQuantity(item.id, 1);

        const remove = document.createElement("button");
        remove.className = "remove-button";
        remove.textContent = "Remove";
        remove.onclick = () => removeFromCart(item.id);

        controls.append(minus, quantity, plus, remove);
        row.append(name, controls);
        cartItems.appendChild(row);
      });

      document.getElementById("cart-count").textContent = count;
      document.getElementById("cart-total").textContent =
        total.toLocaleString("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
    }

    function showDetails(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      document.getElementById("detail-name").textContent = product.name;
      document.getElementById("detail-description").textContent =
        product.description;
      document.getElementById("detail-price").textContent =
        "₹" + product.price.toLocaleString("en-IN");

      document.getElementById("product-dialog").showModal();
    }

    function closeDetails() {
      document.getElementById("product-dialog").close();
    }

    function goToCart() {
      document.getElementById("cart-section").scrollIntoView({
        behavior: "smooth"
      });
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty. Please add a product first.");
        return;
      }

      alert(
        "Demo checkout only! Your total is ₹" +
        cart.reduce((sum, item) => {
          const product = products.find(p => p.id === item.id);
          return sum + product.price * item.quantity;
        }, 0).toLocaleString("en-IN") +
        ". Online order processing is not connected yet."
      );
    }

    document.getElementById("search").addEventListener("input", event => {
      const query = event.target.value.toLowerCase().trim();

      const filtered = products.filter(product =>
        product.name.toLowerCase().includes(query) ||
        product.description.toLowerCase().includes(query)
      );

      renderProducts(filtered);
    });

    renderProducts(products);
    renderCart();
  </script>

</body>
</html>
